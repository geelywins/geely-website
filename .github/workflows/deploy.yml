name: Deploy website ke GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Bangun ulang tiap hari pukul 05:30 WIB supaya artikel terjadwal tayang otomatis
  schedule:
    - cron: '30 22 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Kalau ada file .zip di halaman utama repository, ekstrak otomatis.
      # Isi yang sudah diatur lewat admin (src/data, src/content, public/images) tidak ditimpa.
      - name: Ekstrak ZIP kalau ada
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -gt 0 ]; then
            for Z in "${zips[@]}"; do
              echo "Mengekstrak $Z"
              rm -rf /tmp/zipx && mkdir /tmp/zipx
              unzip -q "$Z" -d /tmp/zipx
              SRC=/tmp/zipx
              if [ ! -f "$SRC/package.json" ]; then
                SRC=$(find /tmp/zipx -maxdepth 2 -name package.json -not -path '*/node_modules/*' | head -1 | xargs -r dirname)
              fi
              if [ -z "$SRC" ] || [ ! -f "$SRC/package.json" ]; then
                echo "package.json tidak ditemukan di dalam $Z"; exit 1
              fi
              rm -rf "$SRC/.github"
              # Folder _timpa: perbaikan isi artikel/LP. Tidak langsung menimpa; dititipkan ke folder _perbaikan lalu digabung
              # di langkah berikutnya (status draft dan tanggal tayang milik Anda TIDAK berubah). _hapus.txt = daftar file yang dihapus (hanya src/content/)
              if [ -d "$SRC/_timpa" ]; then
                if [ -f "$SRC/_timpa/_hapus.txt" ]; then
                  while IFS= read -r f; do
                    f=$(echo "$f" | tr -d '\r')
                    case "$f" in src/content/*.md) case "$f" in *..*) ;; *) rm -f "$f" ;; esac ;; esac
                  done < "$SRC/_timpa/_hapus.txt"
                  rm -f "$SRC/_timpa/_hapus.txt"
                fi
                mkdir -p _perbaikan
                cp -a "$SRC/_timpa/." _perbaikan/
                rm -rf "$SRC/_timpa"
              fi
              # Folder isi (data, artikel, foto): hanya tambah file yang belum ada, file yang sudah Anda ubah tidak ditimpa
              for d in src/data src/content public/images; do
                if [ -d "$SRC/$d" ]; then
                  mkdir -p "$d"
                  cp -an "$SRC/$d/." "$d/"
                  rm -rf "$SRC/$d"
                fi
              done
              cp -a "$SRC"/. .
              rm -f "$Z"
            done
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Terapkan pembaruan dari ZIP otomatis" || true
            git push origin "HEAD:$BRANCH"
          fi

      # Terapkan perbaikan isi dari folder _perbaikan atau _timpa (kalau ada).
      # Isi tulisan diganti, tetapi baris "draft" dan "date" file yang sudah ada di repository dipertahankan.
      - name: Terapkan perbaikan isi
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          ada=0
          for D in _perbaikan _timpa; do
            if [ -d "$D" ]; then
              ada=1
              python3 - "$D" <<'PY'
          import os, re, sys, shutil
          root = sys.argv[1]
          def pecah(t):
              m = re.match(r'^(---\r?\n)([\s\S]*?)(\r?\n---\r?\n?)([\s\S]*)$', t)
              return m.groups() if m else None
          for dp, _, fs in os.walk(root):
              for f in fs:
                  p = os.path.join(dp, f)
                  rel = os.path.relpath(p, root).replace(os.sep, '/')
                  if rel.startswith('..') or '/..' in rel or rel.startswith('.github'):
                      continue
                  d = os.path.dirname(rel)
                  if d:
                      os.makedirs(d, exist_ok=True)
                  if rel.startswith('src/content/') and rel.endswith('.md') and os.path.exists(rel):
                      lama = pecah(open(rel, encoding='utf-8').read())
                      baru = pecah(open(p, encoding='utf-8').read())
                      if lama and baru:
                          fm = baru[1]
                          for k in ('draft', 'date'):
                              m = re.search(r'^' + k + r':.*$', lama[1], re.M)
                              if not m:
                                  continue
                              if re.search(r'^' + k + r':.*$', fm, re.M):
                                  fm = re.sub(r'^' + k + r':.*$', lambda _: m.group(0), fm, count=1, flags=re.M)
                              else:
                                  fm = fm + '\n' + m.group(0)
                          open(rel, 'w', encoding='utf-8', newline='').write(baru[0] + fm + baru[2] + baru[3])
                          print('Digabung (status dipertahankan):', rel)
                          continue
                  shutil.copy2(p, rel)
                  print('Disalin:', rel)
          PY
              rm -rf "$D"
            fi
          done
          if [ "$ada" = 1 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Terapkan perbaikan isi otomatis" || true
            git push origin "HEAD:$BRANCH" || true
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm install

      # Alamat otomatis: kalau ada file public/CNAME (isi: nama domain), website memakai domain itu.
      # Kalau tidak ada, dipakai https://USERNAME.github.io/NAMA-REPO/
      - name: Build
        run: |
          if [ -s public/CNAME ]; then
            DOMAIN=$(head -1 public/CNAME | tr -d '[:space:]')
            export SITE_URL="https://$DOMAIN"
            export BASE_PATH=""
          else
            export SITE_URL="https://${{ github.repository_owner }}.github.io"
            export BASE_PATH="/${{ github.event.repository.name }}"
          fi
          echo "SITE_URL=$SITE_URL BASE_PATH=$BASE_PATH"
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Setelah website tayang: kabari mesin pencari (IndexNow) hanya untuk halaman baru/berubah.
  # Hanya jalan kalau memakai domain sendiri (ada file public/CNAME dan file kunci public/<kunci>.txt).
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Siapkan
        id: cfg
        run: |
          DOMAIN=""; KEY=""
          if [ -s public/CNAME ]; then DOMAIN=$(head -1 public/CNAME | tr -d '[:space:]'); fi
          for f in public/*.txt; do
            b=$(basename "$f" .txt)
            if echo "$b" | grep -Eq '^[0-9a-f]{32}$'; then KEY="$b"; fi
          done
          echo "domain=$DOMAIN" >> "$GITHUB_OUTPUT"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
      - name: Ambil catatan sebelumnya
        if: steps.cfg.outputs.domain != '' && steps.cfg.outputs.key != ''
        uses: actions/cache/restore@v4
        with:
          path: .indexnow
          key: indexnow-none
          restore-keys: indexnow-
      - name: Kirim ke IndexNow
        if: steps.cfg.outputs.domain != '' && steps.cfg.outputs.key != ''
        run: |
          sleep 90
          node scripts/indexnow.mjs "${{ steps.cfg.outputs.domain }}" "${{ steps.cfg.outputs.key }}"
      - name: Simpan catatan
        if: steps.cfg.outputs.domain != '' && steps.cfg.outputs.key != ''
        uses: actions/cache/save@v4
        with:
          path: .indexnow
          key: indexnow-${{ github.run_id }}
