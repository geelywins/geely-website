<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Admin Website</title>
<link rel="icon" href="../favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png" />
<link rel="apple-touch-icon" href="../apple-touch-icon.png" />
<style>
  :root { --bg:#0b0f1a; --card:#141b2d; --line:#26304a; --text:#eef2fb; --muted:#9aa5bd; --brand:#3b8cff; --ok:#1fbf75; --bad:#ff5d5d; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); line-height:1.5; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.35rem; margin: 6px 0 4px; }
  h2 { font-size: 1.1rem; margin: 0 0 10px; }
  h3 { font-size: 1rem; margin: 14px 0 4px; color: var(--brand); }
  a { color: var(--brand); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; }
  label { display:block; font-size:.85rem; color:var(--muted); margin:14px 0 4px; }
  input[type=text], input[type=date], input[type=password], textarea, select { width:100%; padding:11px 12px; border-radius:10px; border:1px solid var(--line); background:#0d1322; color:var(--text); font-size:1rem; font-family:inherit; }
  input[type=color] { width:100%; height:46px; border:1px solid var(--line); border-radius:10px; background:#0d1322; padding:4px; }
  textarea { min-height: 90px; resize: vertical; }
  textarea.mono { font-family: ui-monospace, Consolas, monospace; font-size:.95rem; }
  button { padding:11px 18px; border-radius:10px; border:0; background:var(--brand); color:#fff; font-weight:700; font-size:.95rem; cursor:pointer; }
  button.sec { background:#26304a; }
  button.bad { background:var(--bad); }
  button.sm { padding:7px 12px; font-size:.85rem; }
  button:disabled { opacity:.5; }
  .row { display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; align-items:center; }
  .tabs { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0 14px; }
  .tabs button.on { background:var(--brand); }
  .item { display:flex; justify-content:space-between; gap:10px; align-items:center; padding:12px 0; border-top:1px solid var(--line); }
  .item:first-child { border-top:0; }
  .item small { color:var(--muted); display:block; }
  .item .btns { display:flex; gap:6px; flex-shrink:0; }
  .msg { padding:11px 14px; border-radius:10px; margin:10px 0; font-size:.92rem; display:none; }
  .msg.ok { display:block; background:rgba(31,191,117,.15); border:1px solid var(--ok); }
  .msg.err { display:block; background:rgba(255,93,93,.15); border:1px solid var(--bad); }
  .hint { color:var(--muted); font-size:.8rem; margin-top:4px; }
  .hide { display:none !important; }
  .chk { display:flex; gap:10px; align-items:center; margin-top:14px; }
  .chk input { width:20px; height:20px; }
  .chk label { margin:0; font-size:.95rem; color:var(--text); }
  .lrow { border:1px solid var(--line); border-radius:12px; padding:10px 12px 12px; margin-top:10px; background:#101728; }
  .lrow .fld > label:first-child { margin-top:8px; }
  .lctl { display:flex; gap:6px; justify-content:flex-end; margin-top:8px; }
  details.det { border:1px solid var(--line); border-radius:12px; margin-top:12px; padding:0 12px 12px; background:#101728; }
  details.det > summary { cursor:pointer; padding:12px 0; font-weight:700; }
  .imgf img { display:block; max-width:100%; max-height:200px; border-radius:10px; margin:8px 0; border:1px solid var(--line); }
  .imgf .row { margin-top:8px; }
  .top { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>Admin Website</h1><a id="siteLink" href="#" target="_blank">Lihat website</a></div>
  <div id="msg" class="msg"></div>

  <div class="card" id="setup">
    <h2>Hubungkan ke GitHub (sekali saja)</h2>
    <label>Username GitHub</label>
    <input type="text" id="owner" placeholder="contoh: geelywins" autocapitalize="none" />
    <label>Nama repository</label>
    <input type="text" id="repo" value="geely-website" autocapitalize="none" />
    <label>Branch</label>
    <input type="text" id="branch" value="main" autocapitalize="none" />
    <label>Token GitHub (fine-grained, izin Contents: Read and write)</label>
    <input type="password" id="token" placeholder="github_pat_..." autocapitalize="none" />
    <p class="hint">Token hanya disimpan di browser HP ini dan hanya dikirim ke GitHub.</p>
    <div class="row"><button id="saveCfg">Simpan &amp; Masuk</button></div>
  </div>

  <div class="tabs hide" id="tabs">
    <button class="sec" data-tab="artikel">Artikel</button>
    <button class="sec" data-tab="model">Model Mobil</button>
    <button class="sec" data-tab="slider">Slider</button>
    <button class="sec" data-tab="promo">Promo</button>
    <button class="sec" data-tab="delivery">Delivery</button>
    <button class="sec" data-tab="testimoni">Testimoni</button>
    <button class="sec" data-tab="halaman">Isi Halaman</button>
    <button class="sec" data-tab="unggah">Upload ZIP</button>
    <button class="sec" data-tab="setelan">Pengaturan</button>
    <button class="sec" data-tab="keluar">Keluar</button>
  </div>

  <div id="view"></div>
</div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var BASE = location.pathname.replace(/\/admin\/(index\.html)?$/, '').replace(/\/$/, '');
  var view = $('view');
  var DIR = 'src/content/artikel';
  var navId = 0; // penanda: kalau pindah menu saat data masih dimuat, hasil lama diabaikan
  $('siteLink').href = BASE + '/';

  // =============== utilitas ===============
  function el(tag, props) {
    var e = document.createElement(tag);
    if (props) Object.keys(props).forEach(function (k) {
      var v = props[k];
      if (v === undefined || v === null) return;
      if (k === 'class') e.className = v;
      else if (k === 'text') e.textContent = v;
      else if (k === 'value' || k === 'checked' || k === 'disabled' || k === 'onclick' || k === 'oninput' || k === 'onchange') e[k] = v;
      else e.setAttribute(k, v);
    });
    for (var i = 2; i < arguments.length; i++) {
      var c = arguments[i];
      if (Array.isArray(c)) c.forEach(function (x) { if (x) e.append(x); });
      else if (c) e.append(c);
    }
    return e;
  }
  // ---- Salin link artikel (untuk ditempel ke Google Search Console) ----
  var siteBaseCache = null;
  async function siteBase() {
    if (siteBaseCache) return siteBaseCache;
    var b = new URL('../', location.href).href;
    try { var r = await readFile('public/CNAME'); var d = String(r.text || '').split(/\r?\n/)[0].trim(); if (d) b = 'https://' + d + '/'; } catch (e) {}
    siteBaseCache = b; return b;
  }
  function copyText(t) {
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(t).then(function () { return true; }, function () { return legacyCopy(t); });
    return Promise.resolve(legacyCopy(t));
  }
  function legacyCopy(t) {
    try { var ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.focus(); ta.select(); var ok = document.execCommand('copy'); ta.remove(); return ok; } catch (e) { return false; }
  }
  function artUrl(base, m) { return base + 'artikel/' + m.f.name.replace(/\.md$/, '') + '/'; }

  function btn(text, cls, fn) { return el('button', { type: 'button', class: cls || '', text: text, onclick: fn }); }
  function show(text, type) { var m = $('msg'); m.textContent = text; m.className = 'msg ' + (type || 'ok'); window.scrollTo({ top: 0, behavior: 'smooth' }); }
  function hideMsg() { $('msg').className = 'msg'; }
  function enc(s) { var b = new TextEncoder().encode(s), r = ''; b.forEach(function (x) { r += String.fromCharCode(x); }); return btoa(r); }
  function dec(b64) { var r = atob(b64.replace(/\s/g, '')), u = new Uint8Array(r.length); for (var i = 0; i < r.length; i++) u[i] = r.charCodeAt(i); return new TextDecoder().decode(u); }
  function slugify(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 70); }
  function today() { var d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }
  function imgSrc(p) { return /^(https?:)?\/\/|^data:|^blob:/.test(p) ? p : (p.charAt(0) === '/' ? BASE + p : p); }

  function cfg() { return { owner: localStorage.g_owner, repo: localStorage.g_repo, branch: localStorage.g_branch || 'main', token: localStorage.g_token }; }

  async function gh(path, opts) {
    var c = cfg();
    var res = await fetch('https://api.github.com/repos/' + c.owner + '/' + c.repo + (path ? '/' + path : ''), Object.assign({
      headers: { Authorization: 'Bearer ' + c.token, Accept: 'application/vnd.github+json' }
    }, opts || {}));
    if (!res.ok) {
      var detail = ''; try { detail = (await res.json()).message; } catch (e) {}
      var hint = res.status === 401 ? ' (token salah atau kedaluwarsa)' : res.status === 404 ? ' (cek username, nama repo, dan izin token)' : res.status === 409 || res.status === 422 ? ' (data sudah berubah atau nama sudah dipakai, buka ulang menu ini)' : '';
      throw new Error('GitHub ' + res.status + (detail ? ': ' + detail : '') + hint);
    }
    return res.status === 204 ? null : res.json();
  }
  async function readFile(path) {
    var f = await gh('contents/' + path + '?ref=' + encodeURIComponent(cfg().branch));
    return { text: dec(f.content), sha: f.sha };
  }
  async function putFile(path, contentB64, message, sha) {
    var body = { message: message, content: contentB64, branch: cfg().branch };
    if (sha) body.sha = sha;
    return gh('contents/' + path, { method: 'PUT', body: JSON.stringify(body) });
  }
  // Data bawaan (untuk website lama yang belum punya file baru)
  var DEFS = null;
  async function defs() {
    if (DEFS) return DEFS;
    try { var r = await fetch('./defaults.json', { cache: 'no-cache' }); DEFS = r.ok ? await r.json() : {}; } catch (e) { DEFS = {}; }
    return DEFS;
  }
  function fillDef(def, val) {
    if (val === undefined || val === null) return def;
    if (Array.isArray(def) || Array.isArray(val)) return Array.isArray(val) ? val : def;
    if (def && typeof def === 'object') {
      if (typeof val !== 'object') return def;
      var out = Object.assign({}, val);
      Object.keys(def).forEach(function (k) { out[k] = fillDef(def[k], val[k]); });
      return out;
    }
    return val;
  }
  // Baca JSON; kalau file belum ada di GitHub, pakai nilai bawaan (akan dibuat saat disimpan)
  async function readJsonD(path, defKey) {
    var r;
    try { r = await readJson(path); }
    catch (e) {
      if (!defKey || String(e.message).indexOf('GitHub 404') !== 0) throw e;
      var d0 = (await defs())[defKey];
      return { data: JSON.parse(JSON.stringify(d0 === undefined ? [] : d0)), sha: null };
    }
    if (defKey) { var d = (await defs())[defKey]; if (d !== undefined) r.data = fillDef(d, r.data); }
    return r;
  }
  async function readJson(path) { var r = await readFile(path); return { data: JSON.parse(r.text), sha: r.sha }; }
  function writeJson(path, data, sha, message) { return putFile(path, enc(JSON.stringify(data, null, 2) + '\n'), message, sha); }

  // =============== unggah gambar ===============
  function fileToB64(blob) {
    return new Promise(function (res, rej) { var r = new FileReader(); r.onload = function () { res(String(r.result).split(',')[1]); }; r.onerror = rej; r.readAsDataURL(blob); });
  }
  async function prepImage(file) {
    if (/svg|gif/.test(file.type)) return { blob: file, ext: file.type.indexOf('svg') >= 0 ? 'svg' : 'gif' };
    try {
      var bmp = await createImageBitmap(file);
      var sc = Math.min(1, 1600 / bmp.width), w = Math.round(bmp.width * sc), h = Math.round(bmp.height * sc);
      var cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      var cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, w, h); cx.drawImage(bmp, 0, 0, w, h);
      var blob = await new Promise(function (r) { cv.toBlob(r, 'image/jpeg', 0.85); });
      if (blob) return { blob: blob, ext: 'jpg' };
    } catch (e) {}
    return { blob: file, ext: (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '') };
  }
  async function uploadImage(file, folder) {
    var p = await prepImage(file);
    if (p.blob.size > 8 * 1024 * 1024) throw new Error('Ukuran foto terlalu besar (maks. 8 MB).');
    var name = (slugify(file.name.replace(/\.[^.]+$/, '')) || 'foto') + '-' + Date.now().toString(36) + '.' + p.ext;
    var path = 'public/images/' + folder + '/' + name;
    await putFile(path, await fileToB64(p.blob), 'Unggah gambar ' + name);
    return '/images/' + folder + '/' + name;
  }

  // =============== pembuat form dari skema ===============
  // Setiap field dibuat menjadi {el, get(), check()}.
  function build(f, val, refs) {
    var t = f.type || 'text', ctl, wrap, label;
    function wrapField(control, extra) {
      var d = el('div', { class: 'fld' });
      if (f.label) d.append(el('label', { text: f.label + (f.req ? ' *' : '') }));
      d.append(control);
      if (f.hint) d.append(el('div', { class: 'hint', text: f.hint }));
      if (extra) d.append(extra);
      return d;
    }
    function simple(control, getter) {
      var o = { el: wrapField(control), get: getter, check: function () { return f.req && !String(getter() || '').trim() ? (f.label || f.key) + ' wajib diisi.' : ''; } };
      if (refs && f.key) refs[f.key] = control;
      return o;
    }

    if (t === 'text' || t === 'date' || t === 'tags' || t === 'slug') {
      var v = val == null ? '' : (t === 'tags' ? (val || []).join(', ') : String(val));
      ctl = el('input', { type: t === 'date' ? 'date' : 'text', value: t === 'date' && !v ? today() : v, autocapitalize: (t === 'slug' || f.lower) ? 'none' : undefined });
      if (t === 'slug') {
        if (f.lock) ctl.disabled = true;
        else {
          var manual = !!v;
          ctl.oninput = function () { manual = true; };
          var src = refs && refs[f.from];
          if (src) src.addEventListener('input', function () { if (!manual) ctl.value = slugify(src.value); });
        }
        return simple(ctl, function () { return slugify(ctl.value); });
      }
      if (t === 'tags') return simple(ctl, function () { return ctl.value.split(',').map(function (s) { return s.trim(); }).filter(Boolean); });
      return simple(ctl, function () { return ctl.value.trim(); });
    }
    if (t === 'textarea') {
      ctl = el('textarea', { class: f.mono ? 'mono' : '', value: val == null ? '' : val, maxlength: f.max });
      if (f.rows) ctl.style.minHeight = (f.rows * 24) + 'px';
      var counter = null;
      if (f.max) { counter = el('div', { class: 'hint', text: '' }); var upd = function () { counter.textContent = ctl.value.length + ' / ' + f.max + ' karakter'; }; ctl.oninput = upd; upd(); }
      var o2 = simple(ctl, function () { return f.keepSpace ? ctl.value : ctl.value.trim(); });
      if (counter) o2.el.append(counter);
      return o2;
    }
    if (t === 'lines') {
      ctl = el('textarea', { value: (val || []).join('\n') });
      if (f.rows) ctl.style.minHeight = (f.rows * 24) + 'px';
      return simple(ctl, function () { return ctl.value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean); });
    }
    if (t === 'color') { ctl = el('input', { type: 'color', value: val || '#3b8cff' }); return simple(ctl, function () { return ctl.value; }); }
    if (t === 'select') {
      ctl = el('select');
      var optVals = [];
      (f.options || []).forEach(function (op) { var o = el('option', { value: op.v, text: op.l }); ctl.append(o); optVals.push(op.v); });
      if (val && optVals.indexOf(val) < 0) ctl.append(el('option', { value: val, text: val }));
      ctl.value = val == null ? '' : val;
      return simple(ctl, function () { return ctl.value; });
    }
    if (t === 'check') {
      var cb = el('input', { type: 'checkbox', checked: val === undefined ? !!f.def : !!val, id: 'cb' + Math.random().toString(36).slice(2) });
      var d = el('div', { class: 'chk' }, cb, el('label', { for: cb.id, text: f.label }));
      if (refs && f.key) refs[f.key] = cb;
      return { el: d, get: function () { return cb.checked; }, check: function () { return ''; } };
    }
    if (t === 'image') {
      var path = el('input', { type: 'text', value: val || '', placeholder: 'kosong = tanpa foto', autocapitalize: 'none' });
      var prev = el('img', { alt: '' });
      var setPrev = function (src) { if (src) { prev.src = src; prev.classList.remove('hide'); } else prev.classList.add('hide'); };
      setPrev(val ? imgSrc(val) : '');
      path.oninput = function () { setPrev(path.value.trim() ? imgSrc(path.value.trim()) : ''); };
      var fileIn = el('input', { type: 'file', accept: 'image/*', class: 'hide' });
      var status = el('div', { class: 'hint', text: '' });
      var pick = btn('Pilih foto', 'sec sm', function () { fileIn.click(); });
      fileIn.onchange = async function () {
        var file = fileIn.files[0]; if (!file) return;
        pick.disabled = true; status.textContent = 'Mengunggah...';
        try {
          var url = await uploadImage(file, f.folder || 'umum');
          path.value = url; setPrev(URL.createObjectURL(file)); status.textContent = 'Berhasil diunggah: ' + url;
          if (f.onUploaded) f.onUploaded(url);
        } catch (e) { status.textContent = ''; show(e.message, 'err'); }
        pick.disabled = false; fileIn.value = '';
      };
      var clear = btn('Hapus foto', 'sec sm', function () { path.value = ''; setPrev(''); status.textContent = ''; });
      var box = el('div', { class: 'imgf' }, prev, path, el('div', { class: 'row' }, pick, clear, fileIn), status);
      var o3 = { el: wrapField(box), get: function () { return path.value.trim(); }, check: function () { return f.req && !path.value.trim() ? (f.label || 'Foto') + ' wajib diisi.' : ''; } };
      if (refs && f.key) refs[f.key] = path;
      return o3;
    }
    if (t === 'group') {
      var kids = f.fields.map(function (sf) { return build(sf, (val || {})[sf.key], {}); });
      var inner = el('div', { class: 'grp' }, kids.map(function (k) { return k.el; }));
      var root = inner;
      if (f.label && f.collapse) root = el('details', { class: 'det' }, el('summary', { text: f.label }), inner);
      else if (f.label) root = el('div', null, el('h3', { text: f.label }), inner);
      return {
        el: root,
        get: function () { var o = {}; f.fields.forEach(function (sf, i) { o[sf.key] = kids[i].get(); }); return o; },
        check: function () { for (var i = 0; i < kids.length; i++) { var e = kids[i].check(); if (e) return e; } return ''; }
      };
    }
    if (t === 'list') {
      var sub = f.of || { type: 'group', fields: f.fields };
      var rows = el('div');
      function addRow(v) {
        var b = build(sub, v, {});
        var row = el('div', { class: 'lrow' });
        row._b = b;
        var ctlBar = el('div', { class: 'lctl' },
          btn('↑', 'sec sm', function () { var p = row.previousElementSibling; if (p) rows.insertBefore(row, p); }),
          btn('↓', 'sec sm', function () { var n = row.nextElementSibling; if (n) rows.insertBefore(n, row); }),
          btn('Hapus', 'bad sm', function () { row.remove(); }));
        row.append(b.el, ctlBar); rows.append(row);
      }
      (val || []).forEach(addRow);
      var addBtn = btn('+ ' + (f.addLabel || 'Tambah'), 'sec sm', function () { addRow(f.blank !== undefined ? JSON.parse(JSON.stringify(f.blank)) : (sub.type === 'group' ? {} : '')); });
      var holder = el('div', null, rows, el('div', { class: 'row' }, addBtn));
      return {
        el: wrapField(holder),
        get: function () { return Array.prototype.map.call(rows.children, function (r) { return r._b.get(); }).filter(function (x) { return sub.type === 'group' ? true : !!x; }); },
        check: function () { for (var i = 0; i < rows.children.length; i++) { var e = rows.children[i]._b.check(); if (e) return e; } return ''; }
      };
    }
    throw new Error('Jenis field tidak dikenal: ' + t);
  }

  // Menampilkan form lengkap di #view.
  // opts: {title, fields, data, saveLabel, onSave(values), onCancel, onDelete, intro}
  function renderForm(opts) {
    view.innerHTML = '';
    var refs = {}, data = opts.data || {};
    var built = opts.fields.map(function (f) { return build(f, data[f.key], refs); });
    var save = btn(opts.saveLabel || 'Simpan', '', null);
    var bar = el('div', { class: 'row' }, save);
    if (opts.onCancel) bar.append(btn('Kembali', 'sec', function () { hideMsg(); opts.onCancel(); }));
    var del = null;
    if (opts.onDelete) { del = btn('Hapus', 'bad', null); bar.append(del); }
    view.append(el('div', { class: 'card' }, el('h2', { text: opts.title }), opts.intro ? el('div', { class: 'hint', text: opts.intro }) : null, built.map(function (b) { return b.el; }), bar,
      el('p', { class: 'hint', text: 'Setelah disimpan, website diperbarui otomatis dalam ±1-3 menit.' })));
    save.onclick = async function () {
      hideMsg();
      for (var i = 0; i < built.length; i++) { var e = built[i].check(); if (e) return show(e, 'err'); }
      var values = {}; opts.fields.forEach(function (f, i) { values[f.key] = built[i].get(); });
      save.disabled = true;
      try { await opts.onSave(values); } catch (err) { show(err.message || String(err), 'err'); save.disabled = false; }
    };
    if (del) del.onclick = async function () {
      if (!confirm('Hapus? Tindakan ini tidak bisa dibatalkan dari sini.')) return;
      del.disabled = true;
      try { await opts.onDelete(); } catch (err) { show(err.message || String(err), 'err'); del.disabled = false; }
    };
    window.scrollTo(0, 0);
  }

  // =============== skema ===============

  function parseMd(text) {
    var m = text.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?([\s\S]*)$/), fm = {}, body = text;
    if (m) {
      body = m[2];
      m[1].split(/\r?\n/).forEach(function (line) {
        var i = line.indexOf(':'); if (i < 0) return;
        var k = line.slice(0, i).trim(), v = line.slice(i + 1).trim();
        try { fm[k] = JSON.parse(v); } catch (e) { fm[k] = v.replace(/^['"]|['"]$/g, ''); }
      });
    }
    return { fm: fm, body: body.replace(/^\n+/, '') };
  }
  function buildMd(a) {
    var l = ['---', 'title: ' + JSON.stringify(a.title), 'description: ' + JSON.stringify(a.description), 'date: ' + a.date];
    if (a.updated) l.push('updated: ' + a.updated);
    l.push('category: ' + JSON.stringify(a.category || 'Info Geely'), 'tags: ' + JSON.stringify(a.tags || []));
    if (a.image) l.push('image: ' + JSON.stringify(a.image));
    if (a.video) l.push('video: ' + JSON.stringify(a.video));
    if (a.draft) l.push('draft: true');
    l.push('---', '', a.body.trim(), '');
    return l.join('\n');
  }

  async function tabArtikel() {
    var my = navId;
    view.innerHTML = '<div class="card">Memuat...</div>';
    var items;
    try { items = await gh('contents/' + DIR + '?ref=' + encodeURIComponent(cfg().branch)); }
    catch (e) { if (my !== navId) return; if (/404/.test(e.message)) items = []; else return show(e.message, 'err'); }
    if (my !== navId) return;
    var files = items.filter(function (f) { return /\.md$/.test(f.name); });
    // baca judul & status tiap artikel
    var metas = await Promise.all(files.map(async function (f) {
      try { var r = await readFile(f.path); var m = parseMd(r.text); return { f: f, fm: m.fm, text: r.text, sha: r.sha }; }
      catch (e) { return { f: f, fm: {}, text: null, sha: null }; }
    }));
    if (my !== navId) return;
    metas.forEach(function (m) { m.draft = m.fm.draft === true || m.fm.draft === 'true'; m.title = m.fm.title || m.f.name.replace(/\.md$/, ''); m.date = String(m.fm.date || '').slice(0, 10); });
    var byDate = function (a, b) { return (b.date || '').localeCompare(a.date || '') || b.f.name.localeCompare(a.f.name); };
    var td = today();
    var drafts = metas.filter(function (m) { return m.draft; }).sort(byDate);
    var sched = metas.filter(function (m) { return !m.draft && m.date > td; }).sort(function (a, b) { return a.date.localeCompare(b.date); });
    var live = metas.filter(function (m) { return !m.draft && m.date <= td; }).sort(byDate);

        var base = await siteBase(); var all = live.map(function (m) { return artUrl(base, m); }).join('\n');
        var ok = await copyText(all);
        if (ok) show(live.length + ' link tersalin (satu baris per artikel).'); else prompt('Salin link ini secara manual:', all);
      })));
    }
    view.innerHTML = ''; view.append(card);
  }

  async function editArticle(path) {
    hideMsg(); var my = navId; var data = { date: today(), category: 'Info Geely' }, sha = null;
    if (path) {
      try { var r = await readFile(path); sha = r.sha; var p = parseMd(r.text); data = Object.assign({}, p.fm, { body: p.body, slug: path.split('/').pop().replace(/\.md$/, ''), date: String(p.fm.date || today()).slice(0, 10) }); }
      catch (e) { return show(e.message, 'err'); }
    }
    var isNew = !path; lastArticleImg = '';
    renderForm({
      title: isNew ? 'Artikel Baru' : 'Edit Artikel', fields: SCH.artikel(isNew), data: data, saveLabel: 'Simpan', onCancel: tabArtikel,
      intro: 'Tips: unggah foto di kolom "Gambar utama", lalu tulis ![keterangan](alamat foto) di isi artikel untuk menaruh foto di dalam tulisan. Untuk SEO, tautkan ke halaman lain: [teks](/model/geely-ex5/), [teks](/promo/), [teks](/kontak/), atau artikel lain [teks](/artikel/alamat-artikel/). Di bawah artikel, website otomatis menampilkan artikel terkait.',
      onSave: async function (v) {
        var slug = v.slug || slugify(v.title); if (!slug) throw new Error('Alamat artikel kosong.');
        var a = { title: v.title, description: v.description, date: v.date || today(), category: v.category, tags: v.tags, image: v.image, video: v.video, draft: v.draft, body: v.body };
        if (!isNew && a.date < today()) a.updated = today();
        var target = path || (DIR + '/' + slug + '.md');
        await putFile(target, enc(buildMd(a)), (isNew ? 'Artikel baru: ' : 'Update artikel: ') + a.title, sha);
        if (my !== navId) return;
        show(a.draft ? 'Draft tersimpan (belum tayang di website).' : (a.date > today() ? 'Tersimpan. Artikel dijadwalkan tayang ' + a.date + '.' : 'Tersimpan! Website diperbarui otomatis (±1-3 menit).')); tabArtikel();
      },
      onDelete: isNew ? null : async function () {
        await gh('contents/' + path, { method: 'DELETE', body: JSON.stringify({ message: 'Hapus artikel: ' + path, sha: sha, branch: cfg().branch }) });
        if (my !== navId) return;
        show('Artikel dihapus. Website diperbarui otomatis.'); tabArtikel();
      }
    });
  }

  // =============== koleksi (model, promo) ===============
  async function openCollection(c) {
    var my = navId;
    view.innerHTML = '<div class="card">Memuat...</div>';
    var r; try { r = await readJsonD(c.path, c.def); } catch (e) { if (my !== navId) return; return show(e.message, 'err'); }
    var arr = r.data, sha = r.sha, dirty = false;
    var extra = c.extra ? await c.extra() : null;
    if (my !== navId) return;

    function draw() {
      var card = el('div', { class: 'card' }, el('h2', { text: c.label }));
      var top = el('div', { class: 'row', style: 'margin-top:0' }, btn('+ Tambah', '', function () { edit(-1); }));
      if (dirty) top.append(btn('Simpan Urutan', 'sec', async function () {
        try { await writeJson(c.path, arr, sha, 'Ubah urutan ' + c.label); if (my !== navId) return; show('Urutan tersimpan. Website diperbarui otomatis.'); openCollection(c); } catch (e) { show(e.message, 'err'); }
      }));
      card.append(top);
      if (!arr.length) card.append(el('p', { class: 'hint', text: 'Belum ada data.' }));
      arr.forEach(function (it, i) {
        card.append(el('div', { class: 'item' }, el('div', null, el('b', { text: c.title(it) }), el('small', { text: c.sub(it) })),
          el('div', { class: 'btns' },
            btn('↑', 'sec sm', function () { if (i > 0) { var t = arr[i - 1]; arr[i - 1] = arr[i]; arr[i] = t; dirty = true; draw(); } }),
            btn('↓', 'sec sm', function () { if (i < arr.length - 1) { var t = arr[i + 1]; arr[i + 1] = arr[i]; arr[i] = t; dirty = true; draw(); } }),
            btn('Edit', 'sec sm', function () { edit(i); }))));
      });
      view.innerHTML = ''; view.append(card);
    }
    function edit(i) {
      hideMsg(); var isNew = i < 0, item = isNew ? c.blank() : arr[i];
      renderForm({
        title: isNew ? 'Tambah ' + c.single : 'Edit ' + c.title(item), fields: c.schema(isNew, extra), data: item, onCancel: draw,
        onSave: async function (v) {
          var merged = Object.assign({}, isNew ? {} : arr[i], v);
          if (isNew && c.idKey && arr.some(function (x) { return x[c.idKey] === merged[c.idKey]; })) throw new Error('Alamat internal sudah dipakai, ganti judul/namanya.');
          var next = arr.slice(); if (isNew) next.push(merged); else next[i] = merged;
          await writeJson(c.path, next, sha, (isNew ? 'Tambah ' : 'Update ') + c.single + ': ' + c.title(merged));
          if (my !== navId) return;
          show('Tersimpan! Website diperbarui otomatis (±1-3 menit).'); openCollection(c);
        },
        onDelete: isNew ? null : async function () {
          var next = arr.slice(); next.splice(i, 1);
          await writeJson(c.path, next, sha, 'Hapus ' + c.single + ': ' + c.title(arr[i]));
          if (my !== navId) return;
          show('Dihapus. Website diperbarui otomatis.'); openCollection(c);
        }
      });
    }
    draw();
  }

  var COL = {
    model: { def: 'models', path: 'src/data/models.json', label: 'Model Mobil', single: 'model', idKey: 'slug', schema: SCH.model,
      title: function (m) { return m.nama; }, sub: function (m) { return m.harga || ''; },
      blank: function () { return { warna: '#3b8cff', keunggulan: [], spesifikasi: [], galeri: [], foto: '', harga: 'Hubungi sales untuk harga & promo terbaru' }; } },
    promo: { def: 'promo', path: 'src/data/promo.json', label: 'Promo', single: 'promo', idKey: 'id', schema: SCH.promo,
      title: function (p) { return p.judul + (p.aktif ? '' : ' (nonaktif)'); }, sub: function (p) { return p.periode || ''; },
      blank: function () { return { aktif: true, foto: '', model: '', periode: '' }; },
      extra: async function () { try { return (await readJsonD('src/data/models.json', 'models')).data; } catch (e) { return []; } } }
  };
  var modelsExtra = COL.promo.extra;
  COL.slider = { def: 'slider', path: 'src/data/slider.json', label: 'Slider Beranda', single: 'slide', schema: SCH.slider,
    title: function (x) { return x.judul.replace(/[{}]/g, '') + (x.aktif ? '' : ' (nonaktif)'); }, sub: function (x) { return x.label || ''; },
    blank: function () { return { aktif: true, foto: '', warna: '#3b8cff', link: 'wa', link2: '' }; } };
  COL.delivery = { def: 'delivery', path: 'src/data/delivery.json', label: 'Delivery Moment', single: 'delivery', schema: SCH.delivery, extra: modelsExtra,
    title: function (x) { return x.judul + (x.aktif ? '' : ' (nonaktif)'); }, sub: function (x) { return [x.nama, x.tanggal].filter(Boolean).join(' - '); },
    blank: function () { return { aktif: true, foto: '', model: '', tanggal: today() }; } };
  COL.testimoni = { def: 'testimoni', path: 'src/data/testimoni.json', label: 'Testimoni', single: 'testimoni', schema: SCH.testimoni, extra: modelsExtra,
    title: function (x) { return x.nama + (x.aktif ? '' : ' (nonaktif)'); }, sub: function (x) { return String(x.teks || '').slice(0, 60); },
    blank: function () { return { aktif: true, foto: '', model: '', rating: '5' }; } };

  // =============== dokumen tunggal (pengaturan, isi halaman) ===============
  async function openDoc(path, title, schemaFn, normalize, intro, defKey) {
    var my = navId;
    view.innerHTML = '<div class="card">Memuat...</div>';
    var r; try { r = await readJsonD(path, defKey); } catch (e) { if (my !== navId) return; return show(e.message, 'err'); }
    if (my !== navId) return;
    renderForm({
      title: title, fields: schemaFn(), data: r.data, intro: intro,
      onSave: async function (v) {
        var merged = Object.assign({}, r.data, v); if (normalize) merged = normalize(merged);
        await writeJson(path, merged, r.sha, 'Update ' + title);
        if (my !== navId) return;
        show('Tersimpan! Website diperbarui otomatis (±1-3 menit).'); openDoc(path, title, schemaFn, normalize, intro, defKey);
      }
    });
  }
  function normSettings(d) {
    var wa = String(d.whatsapp || '').replace(/[^0-9]/g, '');
    if (wa.charAt(0) === '0') wa = '62' + wa.slice(1);
    if (wa.length < 9) throw new Error('Nomor WhatsApp belum benar. Contoh: 087710208822');
    d.whatsapp = wa; return d;
  }

  // =============== upload ZIP pembaruan website ===============
  function tabUnggah() {
    var c = cfg(), file = null;
    var inp = el('input', { type: 'file', accept: '.zip,application/zip,application/x-zip-compressed' });
    var info = el('div', { class: 'hint', text: 'Belum ada file dipilih.' });
    var go1 = btn('Unggah & Terapkan', '', async function () {
      if (!file) return show('Pilih file ZIP dulu.', 'err');
      if (!/\.zip$/i.test(file.name)) return show('File harus berformat .zip', 'err');
      if (file.size > 40 * 1024 * 1024) return show('Ukuran ZIP terlalu besar (maks. 40 MB).', 'err');
      if (!confirm('Unggah ' + file.name + ' dan terapkan ke website?\n\nIsi yang sudah Anda ubah lewat admin tidak akan ditimpa.')) return;
      go1.disabled = true; info.textContent = 'Mengunggah...';
      try {
        var name = 'update-' + Date.now().toString(36) + '.zip';
        await putFile(name, await fileToB64(file), 'Unggah pembaruan website: ' + file.name, null);
        info.textContent = '';
        show('Berhasil diunggah. Website diproses otomatis, tunggu ±2-4 menit lalu muat ulang website. Cek progres di tab Actions GitHub.');
        inp.value = ''; file = null;
      } catch (e) { info.textContent = ''; show(e.message, 'err'); }
      go1.disabled = false;
    });
    inp.onchange = function () { file = inp.files[0] || null; info.textContent = file ? file.name + ' (' + Math.round(file.size / 1024) + ' KB)' : 'Belum ada file dipilih.'; };
    var card = el('div', { class: 'card' }, el('h2', { text: 'Upload ZIP Pembaruan Website' }),
      el('p', { class: 'hint', text: 'Pilih file ZIP yang dikirim Claude. File akan dikirim ke GitHub, lalu website membangun ulang dan terbit otomatis. Isi yang sudah Anda ubah lewat admin (artikel, model, promo, foto, pengaturan) tidak ditimpa.' }),
      el('label', { text: 'File ZIP' }), inp, info, el('div', { class: 'row' }, go1),
      el('p', { class: 'hint', text: 'Catatan: file proses (folder .github) tidak ikut diterapkan lewat ZIP. Perbarui lewat tombol di bawah.' }));
    var wfInfo = el('div', { class: 'hint', text: '' });
    var wfBtn = btn('Perbarui file proses (deploy.yml)', 'sec', async function () {
      if (!confirm('Perbarui file proses website (deploy.yml) ke versi terbaru?')) return;
      wfBtn.disabled = true; wfInfo.textContent = 'Memproses...';
      try {
        var r0 = await fetch('./deploy.yml.txt', { cache: 'no-cache' });
        if (!r0.ok) throw new Error('File deploy.yml.txt belum ada di website. Unggah ZIP terbaru dulu.');
        var txt = await r0.text(), path = '.github/workflows/deploy.yml', sha = null;
        try { sha = (await readFile(path)).sha; } catch (e) { if (String(e.message).indexOf('GitHub 404') !== 0) throw e; }
        await putFile(path, enc(txt), 'Perbarui file proses website (deploy.yml)', sha);
        wfInfo.textContent = ''; show('deploy.yml berhasil diperbarui.');
      } catch (e) {
        wfInfo.textContent = '';
        var m = /403|404|workflow/i.test(e.message) && !/deploy.yml.txt/.test(e.message) ? e.message + ' | Kemungkinan token belum punya izin "Workflows: Read and write". Buka GitHub, Settings, Developer settings, Fine-grained tokens, edit token, tambahkan izin Workflows = Read and write, lalu simpan.' : e.message;
        show(m, 'err');
      }
      wfBtn.disabled = false;
    });
    card.append(el('h3', { text: 'File proses website' }), el('p', { class: 'hint', text: 'Dipakai kalau Claude memberi tahu deploy.yml berubah. Token harus punya izin Workflows: Read and write.' }), el('div', { class: 'row' }, wfBtn), wfInfo);
    view.innerHTML = ''; view.append(card);
  }

  // =============== menu & awal ===============
  function setTab(name) { Array.prototype.forEach.call($('tabs').querySelectorAll('button'), function (b) { b.classList.toggle('on', b.getAttribute('data-tab') === name); }); }
  function go(name) {
    if (name === 'keluar' && !confirm('Yakin mau keluar?\n\nAnda harus memasukkan token GitHub lagi untuk masuk.')) return;
    navId++; hideMsg(); setTab(name);
    if (name === 'artikel') return tabArtikel();
    if (name === 'model') return openCollection(COL.model);
    if (name === 'promo') return openCollection(COL.promo);
    if (name === 'slider') return openCollection(COL.slider);
    if (name === 'delivery') return openCollection(COL.delivery);
    if (name === 'testimoni') return openCollection(COL.testimoni);
    if (name === 'unggah') return tabUnggah();
    if (name === 'halaman') return openDoc('src/data/content.json', 'Isi Halaman', SCH.content, null, 'Buka tiap bagian di bawah untuk mengubah tulisan di website.', 'content');
    if (name === 'setelan') return openDoc('src/data/settings.json', 'Pengaturan Website', SCH.settings, normSettings, undefined, 'settings');
    if (name === 'keluar') { ['g_owner', 'g_repo', 'g_branch', 'g_token'].forEach(function (k) { localStorage.removeItem(k); }); $('token').value = ''; showLogin(); show('Anda sudah keluar. Data login dihapus dari browser ini.'); }
  }
  Array.prototype.forEach.call($('tabs').querySelectorAll('button'), function (b) { b.onclick = function () { go(b.getAttribute('data-tab')); }; });

  function showLogin() { $('setup').classList.remove('hide'); $('tabs').classList.add('hide'); view.innerHTML = ''; }
  function showApp() { $('setup').classList.add('hide'); $('tabs').classList.remove('hide'); go('artikel'); }

  $('saveCfg').onclick = async function () {
    var o = $('owner').value.trim(), r = $('repo').value.trim(), b = $('branch').value.trim() || 'main', t = $('token').value.trim();
    if (!o || !r || !t) return show('Isi username, nama repository dan token dulu.', 'err');
    localStorage.g_owner = o; localStorage.g_repo = r; localStorage.g_branch = b; localStorage.g_token = t;
    try { await gh(''); } catch (e) { return show(e.message, 'err'); }
    hideMsg(); showApp();
  };

  var c0 = cfg();
  $('owner').value = c0.owner || ''; $('repo').value = c0.repo || 'geely-website'; $('branch').value = c0.branch || 'main';
  if (c0.owner && c0.repo && c0.token) showApp(); else showLogin();
})();
